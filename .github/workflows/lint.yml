name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}:${{ github.ref }}:lint
      cancel-in-progress: true
    uses: matt-riley/matt-riley-ci/.github/workflows/ci.yml@b65e4f9b6883ebb8735e5f5e61f46d226024b76d # v4
    with:
      install: true
      lint: true
