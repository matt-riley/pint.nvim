name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}:${{ github.ref }}:lint
      cancel-in-progress: true
    uses: matt-riley/matt-riley-ci/.github/workflows/ci.yml@8526bf82dbe51e5c0f5db5a2fe7ad09b03a60107 # v4.2.0
    with:
      install: true
      lint: true
