name: Typecheck

on:
  push:
  pull_request:

jobs:
  typecheck:
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}:${{ github.ref }}:typecheck
      cancel-in-progress: true
    uses: matt-riley/matt-riley-ci/.github/workflows/nvim-typecheck.yml@f846763f763247cb0140e3dd08002280b001f6cf # v4.2.0
