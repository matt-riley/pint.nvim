name: Format

on:
  push:
  pull_request:

jobs:
  format:
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}:${{ github.ref }}:format
      cancel-in-progress: true
    uses: matt-riley/matt-riley-ci/.github/workflows/ci.yml@f846763f763247cb0140e3dd08002280b001f6cf # v4.2.0
    with:
      install: true
      fmt: true
