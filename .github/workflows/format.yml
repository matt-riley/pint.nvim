name: Format

on:
  push:
  pull_request:

jobs:
  format:
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}:${{ github.ref }}:format
      cancel-in-progress: true
    uses: matt-riley/matt-riley-ci/.github/workflows/ci.yml@2761920a2537112201681132b79d2e48fd41c36b # v4
    with:
      install: true
      fmt: true
