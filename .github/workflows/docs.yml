name: Docs

on:
  push:
    branches:
      - main
    paths:
      - "lua/**"
      - "plugin/**"
      - "Makefile"
      - ".mise.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  docs:
    permissions:
      contents: write
    uses: matt-riley/matt-riley-ci/.github/workflows/nvim-docs.yml@e8a2503259d33b925cad2bc018e052a2579f441d # v4.2.0
    with:
      commit-message: "chore(docs): regenerate vim help"
      neovim-version: nightly
