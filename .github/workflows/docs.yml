name: Docs

on:
  push:
    branches:
      - main
    paths:
      - "lua/**"
      - "plugin/**"
      - "Makefile"
      - ".mise.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  docs:
    permissions:
      contents: write
    uses: matt-riley/matt-riley-ci/.github/workflows/nvim-docs.yml@8526bf82dbe51e5c0f5db5a2fe7ad09b03a60107 # v4.2.0
    with:
      commit-message: "chore(docs): regenerate vim help"
      neovim-version: nightly
