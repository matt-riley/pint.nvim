name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}:${{ github.ref }}:tests
      cancel-in-progress: true
    uses: matt-riley/matt-riley-ci/.github/workflows/ci.yml@0a310f1286537ed4fd000af4b35cd6459b00448d # v4
    with:
      install: true
      test: true
      task-env: |
        MINI_PATH=${{ github.workspace }}/.ci/mini.nvim
