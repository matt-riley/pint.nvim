name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}:${{ github.ref }}:tests
      cancel-in-progress: true
    uses: matt-riley/matt-riley-ci/.github/workflows/ci.yml@002d16c00bc74ebced433f0a16187c9b13451194 # v4.2.0
    with:
      install: true
      test: true
      task-env: |
        MINI_PATH=${{ github.workspace }}/.ci/mini.nvim
