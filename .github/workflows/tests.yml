name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}:${{ github.ref }}:tests
      cancel-in-progress: true
    uses: matt-riley/matt-riley-ci/.github/workflows/ci.yml@e8a2503259d33b925cad2bc018e052a2579f441d # v4.2.0
    with:
      install: true
      test: true
      task-env: |
        MINI_PATH=${{ github.workspace }}/.ci/mini.nvim
